server.port=8081

# Veritabanı Yapılandırması (Ortam Değişkeni Destekli & Geriye Uyumlu)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/fairoptima_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Yapılandırması
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator Yapılandırması (health, info, metrics)
management.endpoints.web.exposure.include=health,info,metrics
management.info.env.enabled=true
info.app.name=FairOptima REST API
info.app.description=Kariyer Fuari Stant ve Kaynak Optimizasyon Sistemi
info.app.version=1.0.0
info.app.developers=Berk Dincer, Aysegul Aslan

# Uygulama ve Sistem Bilgileri (@Value & Lifecycle)
app.fair.system-name=FairOptima Management Engine
app.fair.version=1.0.0
app.fair.default-currency=TRY
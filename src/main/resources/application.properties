spring.application.name=fair-optima-api
server.port=8081

# WampServer MySQL Baglantisi (Port: 3308)
spring.datasource.url=jdbc:mysql://localhost:3308/fairoptima_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Saf Hibernate / JPA Yapilandirmasi
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator Endpoint Ayarlari
management.endpoints.web.exposure.include=health,info
spring.application.name=fair-optima-api
server.port=8081

# WAMP MySQL Baglantisi (Port 3308)
spring.datasource.url=jdbc:mysql://localhost:3308/fairoptima_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Ayarlari (Saf EntityManager / DDL Auto)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator Yapilandirmasi
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=FairOptima Career Fair Management API
info.app.description=Kariyer Fuari Stant ve Kaynak Optimizasyon Sistemi REST API
info.app.version=1.0.0
server.error.whitelabel.enabled=false